name: Midnight Watch daily reading

on:
  schedule:
    - cron: "0 0 * * *"      # every day at 00:00 UTC
  workflow_dispatch:         # lets you press "Run workflow" by hand

permissions:
  contents: write

jobs:
  reading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run the board
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python brain.py

      - name: Commit today's reading
        run: |
          git config user.name "midnight-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/latest.json data/history.json
          git commit -m "Reading for $(date -u +%Y-%m-%d)" || echo "nothing changed"
          git push
