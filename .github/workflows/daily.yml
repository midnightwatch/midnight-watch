name: Midnight Watch daily reading

on:
  schedule:
    - cron: "0 23 * * *"     # every day at 23:00 UTC; the reading is dated for the next day
  workflow_dispatch:         # lets you press "Run workflow" by hand
    inputs:
      month:
        description: "Only write the monthly report for this month (YYYY-MM) and skip the daily reading"
        required: false
        default: ""
      reset:
        description: "Type RESET to wipe all readings and restart from the official clock (keeps official.json)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  reading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run the board
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MONTH: ${{ github.event.inputs.month }}
          RESET: ${{ github.event.inputs.reset }}
        run: |
          if [ "$RESET" = "RESET" ]; then
            echo "resetting all readings"
            rm -f data/latest.json data/history.json data/share.png data/share-next.png
            rm -rf data/days data/months
          fi
          if [ -n "$MONTH" ]; then
            python brain.py --month "$MONTH"
          else
            python brain.py
          fi

      - name: Commit the reading
        run: |
          git config user.name "midnight-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data/
          git commit -m "Reading written $(date -u +'%Y-%m-%d %H:%M') UTC" || echo "nothing changed"
          git pull --rebase
          git push
